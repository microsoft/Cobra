#------------------------------------------------------
#
# APPLICATION CONFIG:
#   com.nuance.mobility.ncs-nmsp: ncs-nmsp-http-servlet
# 
#------------------------------------------------------

#
# Watcher configuration
#
config.ServiceName=ncs-nmsp-http-servlet

httpnmsp.gateway.context.path=/NmspServlet/

httpnmsp.param.default.server_ip = 0.0.0.0
httpnmsp.param.default.server_port = 0
httpnmsp.param.default.command_timeout = 30000

# Keeping the name whitelist as a legacy name from 1.X
httpnmsp.whitelist=NMDPPRODUCTIONHTTP.*,NMDPTRIAL.*,NMAID_ONPREMISE_APPLICATION.*,.*

httpnmsp.authorizedIps=.*

# The default '$^' matches nothing
httpnmsp.authorizedCrossOrigins=$^

httpnmsp.enableClientCallLogs=true
#
# Jetty configuration
#
jetty.context.path=/
jetty.http.port=8080

