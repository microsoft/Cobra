#----------------------------------------------------------------------
#
# DEV log file :
#    com.nuance.mobility.ncs-nmsp: ncs-nmsp-http-servlet
#
# To use in eclipse; In Run configuration's "VM arguments" section add
# -Dlog4j.configuration=file:src/main/config/log4j.dev.properties
# 
#----------------------------------------------------------------------

log4j.rootLogger=INFO, stdout

log4j.logger.com.nuance.nmm.jetty=DEBUG
log4j.logger.com.nuance.framework=DEBUG

log4j.logger.com.nuance.ncs-nmsp.nmsp=DEBUG
log4j.logger.com.nuance.ncs.nmsp.engine.utils.OggStreamer=DEBUG

#---------------------------------------------------------------
# Console appender
#---------------------------------------------------------------
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%-5p [%t] %c{1} - %m%n