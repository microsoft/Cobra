#---------------------------------------------------------------
#
# PRODUCTION log file:
#     com.nuance.mobility.ncs-nmsp: ncs-nmsp-http-servlet
# 
# Default Logging level: INFO
# File appender in production.
#---------------------------------------------------------------
log4j.rootLogger=INFO, fileLog

#
# Add here the packages or classes you want to see in DEBUG in production.
# example:
# log4j.logger.com.nuance.ncs-nmsp.nmsp=DEBUG
#

#---------------------------------------------------------------
# File appender
#---------------------------------------------------------------
log4j.appender.fileLog.File=$NUANCE/logs/nmsp-http-servlet${config.service.instance.number}/ncs-nmsp-http-servlet${config.service.instance.number}
log4j.appender.fileLog=com.nuance.vaf.logging.CLAPIRollingFileAppender
log4j.appender.fileLog.Encoding=UTF-8
log4j.appender.fileLog.Append=false
log4j.appender.fileLog.MaxFileSize=65536KB
log4j.appender.fileLog.MaxBackupIndex=30
log4j.appender.fileLog.layout=org.apache.log4j.PatternLayout
log4j.appender.fileLog.layout.ConversionPattern=%-5p %d [%t] %c - %m%n